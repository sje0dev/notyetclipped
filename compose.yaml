name: notyetclipped

x-backend-env: &backend-env
  DATABASE_URL: postgres://notyetclipped:${POSTGRES_PASSWORD:-local-postgres-change-me}@postgres:5432/notyetclipped
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://s3:9000}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL-http://localhost:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-local-access-key}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-secret-change-me}
  S3_BUCKET: ${S3_BUCKET:-notyetclipped}
  S3_REGION: ${S3_REGION:-us-east-1}
  DATA_DIR: /data
  CHATGPT_CALLBACK_URL: http://127.0.0.1:${WEB_PORT:-3000}/api/ai/callback

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notyetclipped
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-change-me}
      POSTGRES_DB: notyetclipped
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U notyetclipped -d notyetclipped]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  s3:
    image: rustfs/rustfs:1.0.3-glibc
    profiles: [local-storage]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-local-access-key}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-local-secret-change-me}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [s3-data:/data]
    restart: unless-stopped

  storage-init:
    build: ./backend
    profiles: [local-storage]
    depends_on: [s3]
    environment:
      <<: *backend-env
    command: [init-storage]

  migrate:
    build: ./backend
    command: [migrate]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./backend
    command: [api]
    environment: *backend-env
    volumes: [scratch-data:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully, required: false }
    healthcheck:
      test: [CMD, notyetclipped, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./backend
    command: [worker]
    environment: *backend-env
    volumes: [scratch-data:/data]
    shm_size: 256mb
    init: true
    stop_grace_period: 45s
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully, required: false }
    restart: unless-stopped

  web:
    build: .
    environment:
      NUXT_API_BASE: http://api:8000
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
  scratch-data:
